<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%" style="background:#070b14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="drexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>

    <linearGradient id="deepinfraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="860" fill="#070b14"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="0" y1="700" x2="1200" y2="700" />
    <line x1="200" y1="0" x2="200" y2="860" />
    <line x1="400" y1="0" x2="400" y2="860" />
    <line x1="600" y1="0" x2="600" y2="860" />
    <line x1="800" y1="0" x2="800" y2="860" />
    <line x1="1000" y1="0" x2="1000" y2="860" />
  </g>

  <!-- Diagram Title Header -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#headerGrad)"/>
    <text x="18" y="24" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle">⚡</text>
    <text x="48" y="22" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="-0.5">CHRONOGROUND ARCHITECTURE</text>
    <text x="48" y="38" fill="#94a3b8" font-size="12" font-weight="500">Zero-Token Multimodal Temporal Localization &amp; Policy Compliance Engine • Drexathon 2026</text>
    <rect x="940" y="4" width="140" height="26" rx="13" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="1010" y="21" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" font-family="monospace">TRACK 1: APEX PREDATOR</text>
  </g>

  <!-- ==================== LAYER 1: MULTIMODAL INGESTION (NDI 1.0) ==================== -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="1080" height="110" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="28" fill="#06b6d4" font-size="11" font-weight="700" font-family="monospace" letter-spacing="1">LAYER 1: NACE PERCEPTION LAYER (NDI 1.0)</text>

    <!-- Sub-Box 1: Video -->
    <rect x="24" y="42" width="500" height="52" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
    <text x="40" y="64" fill="#e2e8f0" font-size="13" font-weight="700">📹 Incident Video Feed (Cam-04 • 180s)</text>
    <text x="40" y="82" fill="#94a3b8" font-size="11">POST /v1/parse → Extracted 60 segments (s01..s60, 3-sec windows with telematics)</text>

    <!-- Sub-Box 2: Policy PDF -->
    <rect x="556" y="42" width="500" height="52" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
    <text x="572" y="64" fill="#e2e8f0" font-size="13" font-weight="700">📄 Fleet Insurance Master Policy (PDF • 15 pages)</text>
    <text x="572" y="82" fill="#94a3b8" font-size="11">POST /v1/extract → Extracted 15 structured legal clauses (c1..c15) with page metadata</text>
  </g>

  <!-- Connector Line 1 to 2 -->
  <line x1="600" y1="220" x2="600" y2="255" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="596,255 604,255 600,263" fill="#38bdf8"/>

  <!-- ==================== LAYER 2: STATE & MATRIX ASSEMBLER ==================== -->
  <g transform="translate(60, 265)">
    <rect x="0" y="0" width="1080" height="95" rx="12" fill="#0b1120" stroke="#0284c7" stroke-width="1.5"/>
    <text x="24" y="26" fill="#38bdf8" font-size="11" font-weight="700" font-family="monospace" letter-spacing="1">LAYER 2: FAST STATE &amp; 141-QUESTION MATRIX ASSEMBLER (FASTAPI BACKEND)</text>

    <g transform="translate(24, 38)">
      <!-- Step A -->
      <rect x="0" y="0" width="310" height="44" rx="6" fill="#0c1e38" stroke="#1d4ed8" stroke-width="1"/>
      <text x="14" y="19" fill="#93c5fd" font-size="11" font-weight="700">1. Assemble JSON State</text>
      <text x="14" y="34" fill="#cbd5e1" font-size="10">User Query + 60 Segments + 15 Clauses</text>

      <!-- Step B -->
      <rect x="330" y="0" width="380" height="44" rx="6" fill="#0c1e38" stroke="#1d4ed8" stroke-width="1"/>
      <text x="14" y="19" fill="#93c5fd" font-size="11" font-weight="700" transform="translate(330, 0)">2. Generate 141-Question Matrix</text>
      <text x="14" y="34" fill="#cbd5e1" font-size="10" transform="translate(330, 0)">60 noul (active) • 60 choice (boundary) • 15 noul (rules) • 6 scores</text>

      <!-- Step C -->
      <rect x="730" y="0" width="302" height="44" rx="6" fill="#0c1e38" stroke="#1d4ed8" stroke-width="1"/>
      <text x="14" y="19" fill="#93c5fd" font-size="11" font-weight="700" transform="translate(730, 0)">3. Parallel Dispatch</text>
      <text x="14" y="34" fill="#cbd5e1" font-size="10" transform="translate(730, 0)">Single Synchronous Batch Operation</text>
    </g>
  </g>

  <!-- Fork Lines from Layer 2 to Layer 3 (Drex vs DeepInfra) -->
  <path d="M 400 360 L 400 395" stroke="#06b6d4" stroke-width="2"/>
  <polygon points="396,395 404,395 400,403" fill="#06b6d4"/>

  <path d="M 800 360 L 800 395" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="796,395 804,395 800,403" fill="#818cf8"/>

  <!-- ==================== LAYER 3: DUAL-BRAIN APEX RACE ==================== -->
  <!-- Drex System One (Left Card) -->
  <g transform="translate(60, 405)">
    <rect x="0" y="0" width="520" height="220" rx="12" fill="url(#drexGrad)" stroke="#06b6d4" stroke-width="2" filter="url(#glowCyan)"/>
    <rect x="20" y="16" width="130" height="22" rx="4" fill="#0891b2"/>
    <text x="85" y="31" fill="#ffffff" font-size="10" font-weight="800" font-family="monospace" text-anchor="middle">DREX SYSTEM 1 (WINNER)</text>

    <text x="20" y="64" fill="#ffffff" font-size="17" font-weight="800">Nace Drex MoE (35B total / 3B active)</text>
    <text x="20" y="82" fill="#67e8f9" font-size="11" font-family="monospace">Endpoint: POST /v1/systemone (X-API-Key)</text>

    <line x1="20" y1="96" x2="500" y2="96" stroke="#164e63" stroke-width="1"/>

    <!-- Metrics Grid -->
    <g transform="translate(20, 110)">
      <text x="0" y="14" fill="#94a3b8" font-size="11">Wall-Clock Latency:</text>
      <text x="160" y="14" fill="#22d3ee" font-size="15" font-weight="900" font-family="monospace">94.2 ms (Sub-150ms ⚡)</text>

      <text x="0" y="34" fill="#94a3b8" font-size="11">Throughput:</text>
      <text x="160" y="34" fill="#e2e8f0" font-size="12" font-weight="700" font-family="monospace">1,496 Questions / Second</text>

      <text x="0" y="54" fill="#94a3b8" font-size="11">Generation Tokens:</text>
      <text x="160" y="54" fill="#4ade80" font-size="12" font-weight="700" font-family="monospace">0 tokens (100% Zero-Token!)</text>

      <text x="0" y="74" fill="#94a3b8" font-size="11">Batch Cost:</text>
      <text x="160" y="74" fill="#4ade80" font-size="12" font-weight="700" font-family="monospace">$0.00028 per triage</text>

      <text x="0" y="94" fill="#94a3b8" font-size="11">Claim Disposition:</text>
      <text x="160" y="94" fill="#f87171" font-size="12" font-weight="900" font-family="monospace">DENY (94.2% Confidence)</text>
    </g>
  </g>

  <!-- DeepInfra System Two (Right Card) -->
  <g transform="translate(620, 405)">
    <rect x="0" y="0" width="520" height="220" rx="12" fill="url(#deepinfraGrad)" stroke="#4338ca" stroke-width="1.5"/>
    <rect x="20" y="16" width="150" height="22" rx="4" fill="#312e81"/>
    <text x="95" y="31" fill="#c7d2fe" font-size="10" font-weight="800" font-family="monospace" text-anchor="middle">DEEPINFRA SYSTEM 2</text>

    <text x="20" y="64" fill="#ffffff" font-size="17" font-weight="800">Qwen/Qwen3.8-27B-Instruct</text>
    <text x="20" y="82" fill="#a5b4fc" font-size="11" font-family="monospace">Endpoint: api.deepinfra.com/v1/openai (Partner Key)</text>

    <line x1="20" y1="96" x2="500" y2="96" stroke="#312e81" stroke-width="1"/>

    <!-- Metrics Grid -->
    <g transform="translate(20, 110)">
      <text x="0" y="14" fill="#94a3b8" font-size="11">Wall-Clock Latency:</text>
      <text x="160" y="14" fill="#94a3b8" font-size="15" font-weight="700" font-family="monospace">3,240 ms (34.4x Slower)</text>

      <text x="0" y="34" fill="#94a3b8" font-size="11">Throughput:</text>
      <text x="160" y="34" fill="#cbd5e1" font-size="12" font-family="monospace">43 Questions / Second</text>

      <text x="0" y="54" fill="#94a3b8" font-size="11">Tokens Consumed:</text>
      <text x="160" y="54" fill="#fbbf24" font-size="12" font-family="monospace">4,460 total tokens</text>

      <text x="0" y="74" fill="#94a3b8" font-size="11">Batch Cost:</text>
      <text x="160" y="74" fill="#fbbf24" font-size="12" font-family="monospace">$0.00350 (92% more expensive)</text>

      <text x="0" y="94" fill="#94a3b8" font-size="11">Claim Disposition:</text>
      <text x="160" y="94" fill="#f87171" font-size="12" font-weight="700" font-family="monospace">DENY (Wordy reasoning text)</text>
    </g>
  </g>

  <!-- Connectors to Layer 4 -->
  <line x1="320" y1="625" x2="320" y2="660" stroke="#06b6d4" stroke-width="2"/>
  <polygon points="316,660 324,660 320,668" fill="#06b6d4"/>

  <line x1="880" y1="625" x2="880" y2="660" stroke="#818cf8" stroke-width="2"/>
  <polygon points="876,660 884,660 880,668" fill="#818cf8"/>

  <!-- ==================== LAYER 4: GROUNDING, INTERN & STAGE DASHBOARD ==================== -->
  <g transform="translate(60, 670)">
    <rect x="0" y="0" width="1080" height="150" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="24" fill="#10b981" font-size="11" font-weight="700" font-family="monospace" letter-spacing="1">LAYER 4: VISUAL GROUNDING, DUAL-BRAIN INTERN SUPERVISOR &amp; 3-PANEL DASHBOARD</text>

    <!-- Sub-Box A: Panel 1 -->
    <rect x="24" y="38" width="325" height="96" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="38" y="58" fill="#38bdf8" font-size="12" font-weight="700">PANEL 1: Telematics &amp; Waveform</text>
    <text x="38" y="74" fill="#cbd5e1" font-size="10">• 60-segment Drex probability bar chart</text>
    <text x="38" y="89" fill="#cbd5e1" font-size="10">• Peak at s13 (36.5s @ 98.2% probability)</text>
    <text x="38" y="104" fill="#cbd5e1" font-size="10">• Auto-seeks video on waveform click</text>
    <text x="38" y="119" fill="#22d3ee" font-size="10" font-weight="600">Action Onset: s12 • Peak: s13 • Offset: s14</text>

    <!-- Sub-Box B: Panel 2 -->
    <rect x="375" y="38" width="330" height="96" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="389" y="58" fill="#34d399" font-size="12" font-weight="700">PANEL 2: NDI Grounded Policy Proof</text>
    <text x="389" y="74" fill="#cbd5e1" font-size="10">• Section 4.2 Exclusion: 96.4% Violated</text>
    <text x="389" y="89" fill="#cbd5e1" font-size="10">• NDI Ground: Page 7 [72, 315, 540, 445]</text>
    <text x="389" y="104" fill="#cbd5e1" font-size="10">• 98.4% pixel certainty crop highlight</text>
    <text x="389" y="119" fill="#34d399" font-size="10" font-weight="600">15 clauses evaluated in single pass</text>

    <!-- Sub-Box C: Panel 3 -->
    <rect x="730" y="38" width="325" height="96" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="744" y="58" fill="#a78bfa" font-size="12" font-weight="700">PANEL 3: Apex Race &amp; Intern Audit</text>
    <text x="744" y="74" fill="#cbd5e1" font-size="10">• Live side-by-side benchmark scoreboard</text>
    <text x="744" y="89" fill="#cbd5e1" font-size="10">• 34.4x speedup / 92% cost savings</text>
    <text x="744" y="104" fill="#cbd5e1" font-size="10">• Nace Intern dual-brain supervisor trace</text>
    <text x="744" y="119" fill="#a78bfa" font-size="10" font-weight="600">Generates legal claim denial audit packet</text>
  </g>
</svg>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChronoGround Architecture Diagram</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #070b14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f1f5f9;
    }
    .container {
      max-width: 1240px;
      width: 100%;
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.7);
    }
    img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .badge {
      background: rgba(6, 182, 212, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h2 style="margin: 0 0 4px 0; font-size: 18px;">ChronoGround Master System Architecture</h2>
        <span style="font-size: 12px; color: #94a3b8;">Drexathon 2026 • Track 1: Apex Predator (Drex vs The Giants)</span>
      </div>
      <span class="badge">architecture_diagram.svg</span>
    </div>
    <img src="architecture_diagram.svg" alt="ChronoGround Full Architecture Diagram" />
  </div>

</html>
